[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "WISDAM"
version = "1.1.0"
authors = [
  { name="Martin Wieser"},
]
description = "A software to work with imagery from pilotet aircrafts, drones or orthophotos"
readme = "readme.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: Microsoft :: Windows :: Windows 10",
	"Operating System :: Microsoft :: Windows :: Windows 11",
    "Development Status :: 3 - Alpha"
]

dependencies = [
	'weitsicht>=0.0.5',
    'numpy>=2.4.0',
	'pyproj>=3.7.2',
	'shapely>=2.0.1',
	'fiona>=1.10.1',
	'pandas>=3.0.2',
	'natsort>=8.4.0',
	'openpyxl>=3.1.3',
	'geopandas>=0.14.4',
	'pillow>=12.2.0',
	'toml>=0.10.2',
	'rawpy>=0.27.0',
	'PySide6>=6.11.0',
	'PySide6_Essentials>=6.11.0',
	'PySide6_Addons>=6.11.0',
	'PyExifTool>=0.5.6']

[project.urls]
    "Homepage" = "https://github.com/WISDAMapp/WISDAM"
    "Bug Tracker" = "https://github.com/WISDAMapp/WISDAM/issues"

[project.scripts]
wisdam = "WISDAM.main:run"
